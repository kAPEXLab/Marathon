<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon</title>

    https://cdn.jsdelivr.net/npm/marked/marked.min.jsscript>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Segoe UI, Arial, sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #1f2937;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .question-link {
            display: block;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        .question-link:hover {
            background: #374151;
        }

        .question-link.active {
            background: #2563eb;
        }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        pre {
            background: #f3f4f6;
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }

        code {
            font-family: Consolas, monospace;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        table,
        th,
        td {
            border: 1px solid #ccc;
        }

        th,
        td {
            padding: 8px;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Assessment Questions</h2>
        <div id="menu"></div>
    </div>

    <div class="content" id="content">
        <h1>Marathon Assessment Repository</h1>
        <p>Select a question from the left menu.</p>
    </div>

    <script>

        async function loadQuestion(file, clickedLink) {

            try {

                document
                    .querySelectorAll('.question-link')
                    .forEach(x => x.classList.remove('active'));

                clickedLink.classList.add('active');

                const response = await fetch(file);

                if (!response.ok) {
                    throw new Error(
                        `Unable to fetch ${file}. Status = ${response.status}`
                    );
                }

                const markdown = await response.text();

                document.getElementById('content').innerHTML =
                    marked.parse(markdown);

            }
            catch (err) {

                console.error(err);

                document.getElementById('content').innerHTML =
                    `<div class="error">
                        Error loading file<br><br>
                        ${err}
                    </div>`;
            }
        }

        async function buildMenu() {

            try {

                const response =
                    await fetch('questions.json');

                if (!response.ok) {
                    throw new Error(
                        `Unable to load questions.json. Status=${response.status}`
                    );
                }

                const questions =
                    await response.json();

                const menu =
                    document.getElementById('menu');

                questions.forEach(question => {

                    const link =
                        document.createElement('a');

                    link.className =
                        'question-link';

                    link.textContent =
                        question.title;

                    link.href = '#';

                    link.onclick = function (e) {

                        e.preventDefault();

                        loadQuestion(
                            question.file,
                            link
                        );
                    };

                    menu.appendChild(link);
                });

                console.log(
                    "questions.json loaded successfully"
                );
            }
